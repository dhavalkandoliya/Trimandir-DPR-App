# Keeps the free-tier Supabase project from auto-pausing after 7 days of
# inactivity by issuing one tiny REST read every 3 days.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL       e.g. https://<ref>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  the public anon key
#
# The anon key is enough: RLS gives anon no policy on projects, so the query
# returns 200 with [] — it still reaches Postgres, which is what counts as activity.

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing secret NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          # Headers go through a file so the key never appears in the process list or logs.
          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT
          printf 'apikey: %s\nAuthorization: Bearer %s\n' "$SUPABASE_ANON_KEY" "$SUPABASE_ANON_KEY" > "$headers_file"

          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            --header @"$headers_file" \
            "${SUPABASE_URL%/}/rest/v1/projects?select=id&limit=1")"

          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "$status" = "200" ]; then
            echo "[$timestamp] Supabase keep-alive OK (HTTP 200)"
          else
            echo "::error::[$timestamp] Supabase keep-alive failed (HTTP $status)"
            exit 1
          fi
